<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Estufa Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EcoEstufa Pro: O Jogo do Equilíbrio 🚀</h1>
        <p>Mantenha a estufa saudável e mude o rumo da produção sustentável!</p>
    </header>

    <main class="game-layout">
        
        <section class="control-panel">
            <div class="hud">
                <div class="stat">
                    <span>📦 Produção: <b id="txt-prod">0</b> kg</span>
                    <div class="bar"><div id="bar-prod" class="fill prod" style="width: 0%;"></div></div>
                </div>
                <div class="stat">
                    <span>🌍 Sustentabilidade: <b id="txt-sust">50</b>%</span>
                    <div class="bar"><div id="bar-sust" class="fill sust" style="width: 50%;"></div></div>
                </div>
            </div>

            <div class="character-box">
                <div id="char-avatar" class="avatar">🤖</div>
                <div class="dialogue">
                    <strong id="char-name">BioBot 1.0:</strong>
                    <p id="char-text">Olá! Sou o assistente da estufa. Vamos plantar para começar?</p>
                </div>
            </div>

            <div class="actions">
                <button id="btn-plantar" onclick="jogar('plantar')">🌱 Plantar Alface</button>
                <button id="btn-colher" onclick="jogar('colher')" disabled>🧺 Colher Alface</button>
                <button id="btn-sensor" onclick="jogar('sensor')">📡 Ativar Sensores IoT</button>
                <button id="btn-solar" onclick="jogar('solar')">☀️ Painel Fotovoltaico</button>
                <button id="btn-reset" onclick="reiniciarJogo()">Reiniciar Simulação</button>
            </div>
        </section>

        <section class="visual-panel">
            <div id="estufa-estrutura" class="greenhouse-frame estufa-normal">
                <div class="glass-roof"></div>
                
                <div id="solar-roof" class="solar-panel-visual hidden"></div>
                
                <div class="cultivo-area">
                    <div class="vaso"><span id="p1" class="planta">🟫</span></div>
                    <div class="vaso"><span id="p2" class="planta">🟫</span></div>
                    <div class="vaso"><span id="p3" class="planta">🟫</span></div>
                    <div class="vaso"><span id="p4" class="planta">🟫</span></div>
                </div>

                <div id="efeito-clima" class="clima-efeito"></div>
            </div>
        </section>

    </main>

    <footer>
        <p>Agrinho 2026 • Programação Ensino Médio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
