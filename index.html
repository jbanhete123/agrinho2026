<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Simulador Agro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p>Encontre o equilíbrio perfeito entre produção e meio ambiente!</p>
    </header>

    <main class="container">
        
        <section class="status-panel">
            <div class="metric">
                <label>📈 Produtividade: <span id="val-producao">50</span>%</label>
                <div class="progress-bar">
                    <div id="bar-producao" class="progress fill-prod" style="width: 50%;"></div>
                </div>
            </div>

            <div class="metric">
                <label>🌱 Preservação Ambiental: <span id="val-ambiente">50</span>%</label>
                <div class="progress-bar">
                    <div id="bar-ambiente" class="progress fill-amb" style="width: 50%;"></div>
                </div>
            </div>
        </section>

        <section class="feedback-box">
            <p id="mensagem">Escolha uma ação para iniciar o manejo da sua fazenda.</p>
        </section>

        <section class="actions-panel">
            <h2>Ações de Manejo:</h2>
            <div class="button-grid">
                <button onclick="tomarDecisao('agrotoxico')">⚠️ Usar Defensivo Químico Comum</button>
                <button onclick="tomarDecisao('biologico')">🐞 Usar Controle Biológico</button>
                <button onclick="tomarDecisao('gotejamento')">💧 Instalar Irrigação por Gotejamento</button>
                <button onclick="tomarDecisao('rotacao')">🔄 Fazer Rotação de Culturas</button>
            </div>
            <button id="btn-reset" onclick="reiniciarSimulador()">Reiniciar Fazenda</button>
        </section>

    </main>

    <footer>
        <p>Projeto Programação - Agrinho 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
